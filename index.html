<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>개념 탐구 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Jua&display=swap">
<style>
/* 노트 같은 모눈종이 위에서 탐구하는 앱. 파란 잉크 + 빨간 펜 + 거북이 초록 */
:root{
  --bg:#eef2f0;--paper:#fbfdfc;--paper2:#f1f6f4;--ink:#14282b;--ink2:#506466;--line:#cfdad8;--grid:rgba(29,95,134,.07);
  --blue:#1d5f86;--blue-soft:#dcecf4;--red:#c8382e;--red-soft:#fbe3e0;--green:#2e7d5b;--green-soft:#dff1e7;--gold:#a8690f;--gold-soft:#f8ecd2;
  --f-disp:'Jua','IBM Plex Sans KR',system-ui,sans-serif;--f-body:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;--r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1e;--paper:#172529;--paper2:#1d2d32;--ink:#e6f0ee;--ink2:#9db3b3;--line:#2c4247;--grid:rgba(120,180,210,.07);
  --blue:#7cc0e6;--blue-soft:#1d3a4a;--red:#ff8a7e;--red-soft:#4a2724;--green:#6fcf9f;--green-soft:#1c3a2d;--gold:#e8b45a;--gold-soft:#3d3118;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1e;--paper:#172529;--paper2:#1d2d32;--ink:#e6f0ee;--ink2:#9db3b3;--line:#2c4247;--grid:rgba(120,180,210,.07);
  --blue:#7cc0e6;--blue-soft:#1d3a4a;--red:#ff8a7e;--red-soft:#4a2724;--green:#6fcf9f;--green-soft:#1c3a2d;--gold:#e8b45a;--gold-soft:#3d3118;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-inline:16px;padding-block:14px 60px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:1080px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font:400 1.35rem var(--f-disp)}
.brand svg{flex:none}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 16px;font-weight:600;min-height:44px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:5px 12px;font-size:.88rem}
.btn.red{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 20px}
.h1{font:400 1.7rem/1.3 var(--f-disp);margin:0 0 6px;text-wrap:balance}
.h2{font:400 1.2rem/1.35 var(--f-disp);margin:0 0 8px}
.note{color:var(--ink2);font-size:.9rem;margin:4px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.chip.gray{background:var(--paper2);color:var(--ink2);border:1px solid var(--line)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.red{background:var(--red-soft);color:var(--red)}
/* 시작 */
.welcome{display:grid;gap:16px;max-width:560px;margin:6vh auto 0}
.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.fieldrow{display:grid;grid-template-columns:1fr 120px;gap:10px}
label.l{display:block;font-size:.85rem;font-weight:600;color:var(--ink2);margin-bottom:4px}
.pcards{display:flex;flex-direction:column;gap:8px}
.pcard{display:flex;justify-content:space-between;gap:10px;text-align:left;width:100%}
/* 홈 */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:14px}
.units{display:flex;flex-direction:column;gap:18px}
.unit h2{font:400 1.25rem var(--f-disp);margin:0 0 4px}
.unit .sub{color:var(--ink2);font-size:.9rem;margin:0 0 10px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.lcard{text-align:left;display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r);padding:14px 16px;min-width:0}
.lcard:hover:not(:disabled){border-color:var(--blue)}
.lcard .no{font:400 .95rem var(--f-disp);color:var(--blue)}
.lcard .t{font-weight:700;font-size:1.05rem}
.lcard .q{color:var(--ink2);font-size:.9rem}
.lcard.soon{opacity:.7;cursor:default}
.lcard.done{border-color:var(--green)}
.bar{height:8px;border-radius:6px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
/* 차시 */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.stepper button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 14px;font-weight:600;font-size:.9rem;min-height:38px}
.stepper button.on{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.stepper button.ok:not(.on){border-color:var(--green);color:var(--green)}
.stepper button:disabled{opacity:.4}
.qbig{font:400 1.55rem/1.4 var(--f-disp);text-wrap:balance;margin:6px 0 12px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:1fr}.fieldrow{grid-template-columns:1fr}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;min-height:46px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.good{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.task{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.task:first-child{border-top:0;margin-top:0;padding-top:0}
.fb{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:.92rem}
.fb.good{background:var(--green-soft);color:var(--green)}
.fb.bad{background:var(--red-soft);color:var(--red)}
.fb.hint{background:var(--gold-soft);color:var(--gold)}
.gen{font-size:1.1rem;line-height:2.4}
.blank{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle;margin:0 4px}
.blank button{border:1.5px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:8px;padding:0 12px;min-height:36px;font-weight:700}
.blank button.good{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.blank button.bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.genitem{padding:8px 0;border-bottom:1px dashed var(--line)}
.genitem:last-child{border-bottom:0}
.sumcard{border-left:5px solid var(--blue)}
.points{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.def{background:var(--blue-soft);border-radius:12px;padding:10px 14px;margin:10px 0}
.def b{color:var(--blue)}
.checks{display:flex;flex-direction:column;gap:12px}
.chk{display:grid;gap:8px}
.chk .qt{font-weight:600}
.ans{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ans input{width:120px;font-size:1.1rem;text-align:center}
.stamp{width:54px;height:54px;border:4px solid var(--red);border-radius:50%;display:grid;place-items:center;color:var(--red);font:400 1.5rem var(--f-disp);transform:rotate(-8deg)}
textarea.in{min-height:110px;resize:vertical;line-height:1.6}
.done-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
/* 위젯 */
.widget{padding:12px 14px}
.widget svg{width:100%;height:auto;display:block;touch-action:none;background:var(--paper2);border-radius:10px;border:1px solid var(--line)}
.wtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.wtabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:3px 14px;font-weight:600;font-size:.88rem;min-height:36px}
.wtabs button.on{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:8px;font-size:.92rem}
.ctl input[type=range]{width:100%;min-height:32px;accent-color:var(--blue)}
.ctl output{font-weight:700;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.read{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-variant-numeric:tabular-nums}
.read span{background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:.92rem}
.read span.hi{border-color:var(--blue);background:var(--blue-soft)}
.verdict{margin-top:10px;padding:8px 12px;border-radius:10px;font-weight:600;background:var(--paper2);border:1px solid var(--line)}
.verdict.yes{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.verdict.no{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{border:1.5px solid var(--blue);border-radius:8px;padding:1px 9px;font-size:.84rem;background:var(--paper)}
.chips.gold span{border-color:var(--gold);color:var(--gold)}
.grid-combo{display:grid;gap:4px;margin-top:8px}
.grid-combo span{border:1.5px solid var(--blue);background:var(--paper);border-radius:6px;padding:2px 4px;font-size:.78rem;text-align:center;white-space:nowrap}
.svgt{fill:var(--ink);font:600 13px var(--f-body)}
.svgm{fill:var(--ink2);font:500 11px var(--f-body)}
/* 교사용 */
.syncline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:var(--paper2);border:1px solid var(--line);font-size:.9rem;margin:6px 0}
.syncline .dot{width:10px;height:10px;border-radius:50%;background:var(--ink2);flex:none}
.syncline.on .dot{background:var(--blue)}.syncline.err{border-color:var(--red)}.syncline.err .dot{background:var(--red)}
.tscroll{overflow-x:auto;padding:6px 8px}
.mx{border-collapse:collapse;width:100%;min-width:640px}
.mx th{font-size:.78rem;color:var(--ink2);font-weight:600;padding:6px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.mx tbody tr{cursor:pointer}.mx tbody tr:hover{background:var(--paper2)}
.cell{display:inline-block;min-width:34px;padding:0 6px;border-radius:8px;font-size:.82rem;font-weight:700}
.cell.d{background:var(--green-soft);color:var(--green)}.cell.p{background:var(--gold-soft);color:var(--gold)}.cell.n{color:var(--line)}
.refl{background:var(--paper2);border-radius:10px;padding:8px 12px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.refl small{display:block;color:var(--ink2);margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;font-size:.92rem}
.toast.on{opacity:1}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:6px;min-height:36px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.figbox{margin:8px 0 12px;max-width:340px}.qfig{width:100%;height:auto;display:block;background:var(--paper2);border:1px solid var(--line);border-radius:10px}.figcap{font-size:11px;color:var(--ink2);margin-top:4px}

.pad{display:grid;gap:6px}
.padhd{font-size:.86rem;color:var(--muted,#5b6470);font-weight:600}
.padwrap{border:1.5px dashed #b9c4cf;border-radius:12px;overflow:hidden;background:#fff linear-gradient(#e8eef3 1px,transparent 1px) 0 0/100% 28px}
.padcv{display:block;width:100%;aspect-ratio:600/440;touch-action:none;cursor:crosshair}
.padtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pt{border:1.5px solid #c9d3dc;background:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-size:.82rem;min-height:36px}
.pt.on{border-color:#1d5fa0;background:#e7f0f9;font-weight:700}
.pt.dot{width:36px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #c9d3dc}
.pt.dot.on{box-shadow:0 0 0 2.5px #1d5fa0}
@media (min-width:700px){
  .chk{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:18px;align-items:start}
  .chk>*{grid-column:1}
  .chk>.pad{grid-column:2;grid-row:1/span 8;position:sticky;top:12px}
}

.bcv{position:fixed;left:0;top:0;z-index:40;touch-action:none;pointer-events:none;display:none;cursor:crosshair}
.bcv.on{display:block}
.bbar{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:12px;z-index:45;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 16px);padding:8px 10px;background:rgba(255,255,255,.96);border:1.5px solid #c9d3dc;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.bbar.on{display:flex}
.bt{border:1.5px solid #c9d3dc;background:#fff;border-radius:10px;padding:6px 12px;font:inherit;font-size:.95rem;min-height:44px}
.bt.on{border-color:#1d5fa0;background:#e7f0f9;font-weight:700}
.bt.x{background:#fdecea;border-color:#e6a8a1}
.bt.dot{width:44px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #c9d3dc}
.bt.dot.on{box-shadow:0 0 0 3px #1d5fa0}
.bfab{position:fixed;right:10px;bottom:84px;z-index:30;width:54px;height:54px;border-radius:50%;border:1.5px solid #c9d3dc;background:rgba(255,255,255,.95);box-shadow:0 3px 12px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.25rem;line-height:1;padding:0}
.bfab small{font-size:.62rem;margin-top:2px;color:#374151}
.bfab.hide{display:none}
.qdt{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
.qdt th,.qdt td{border:1px solid #cfd8e3;padding:6px 8px;text-align:center}
.qdt th{background:#eef3f8}
.dg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:8px 0}
.dg span{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 0;text-align:center;font-size:.82rem;font-variant-numeric:tabular-nums}
.dg span.hd{border:0;background:transparent;color:var(--ink2);font-weight:700}
.dg span.on{background:var(--blue);border-color:var(--blue);color:var(--paper);font-weight:700}
.dg span.wa{background:var(--blue-soft);border-color:var(--blue)}
.dg span.wb{background:var(--gold-soft);border-color:var(--gold)}

</style>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
/* ===== 중2-2 개념 학습 내용 (초안) ===== */
const UNITS = [
  { id: 0, name: 'Ⅳ. 도형의 성질', sub: '삼각형과 사각형의 성질' },
  { id: 1, name: 'Ⅴ. 도형의 닮음', sub: '닮음과 피타고라스 정리' },
  { id: 2, name: 'Ⅵ. 경우의 수와 확률', sub: '세는 방법과 가능성' }
];
const LESSONS = [
  { id: 'l01', unit: 0, no: 1, title: '이등변삼각형의 성질', q: '두 변의 길이가 같은 삼각형에는 어떤 일이 함께 일어날까?', lens: '대칭 · 관계',
    ready: true, widget: 'iso',
    pred: { ask: '길이가 같은 두 변(AB = AC)이 있는 삼각형에서, 그 두 변 맞은편의 각 ∠C와 ∠B의 크기는 어떨 것 같아요?', opts: ['∠B가 더 클 것 같다', '∠C가 더 클 것 같다', '둘이 같을 것 같다', '모르겠다'] },
    tasks: [
      { ask: '슬라이더로 AB = AC(두 값을 같게)로 맞추고 ∠B와 ∠C를 비교해 보세요.', opts: ['∠B > ∠C', '∠B = ∠C', '∠B < ∠C'], ans: 1, why: '두 변의 길이가 같으면 그 맞은편 각의 크기도 같아요.' },
      { ask: 'AB를 AC보다 길게 만들어 보세요. 어느 각이 더 커지나요?', opts: ['∠B가 더 크다', '∠C가 더 크다', '같다'], ans: 1, why: '더 긴 변(AB)의 맞은편 각 ∠C가 더 커요. 변의 길이와 맞은편 각의 크기는 함께 움직여요.' },
      { ask: 'AB = AC로 맞춘 뒤 "수직선 긋기"를 켜 보세요. 점 H는 밑변 BC의 어디에 있나요?', opts: ['B에 가깝다', 'C에 가깝다', 'BC의 한가운데(BH = CH)'], ans: 2, why: 'BH = CH = 5로 꼭 반이에요. 그리고 ∠BAH = ∠HAC도 확인해 보세요.' }
    ],
    gen: { lead: '탐색에서 찾은 것을 문장으로 완성해 보세요.', items: [
      { pre: 'AB = AC인 삼각형(이등변삼각형)에서 두 밑각 ∠B와 ∠C의 크기는', opts: ['같다', '다르다', '알 수 없다'], ans: 0, post: '.' },
      { pre: '이등변삼각형에서 꼭지각의 이등분선은 밑변을', opts: ['수직이등분한다', '3등분한다', '평행하게 지난다'], ans: 0, post: '.' },
      { pre: '거꾸로, 두 내각의 크기가 같은 삼각형은', opts: ['이등변삼각형이다', '직각삼각형이다', '정삼각형이다'], ans: 0, post: '.' }
    ] },
    sum: { title: '이등변삼각형', defs: [['이등변삼각형', '두 변의 길이가 같은 삼각형'], ['꼭지각', '길이가 같은 두 변이 이루는 각'], ['밑각', '꼭지각의 반대쪽 변(밑변)의 양 끝 각']],
      points: ['이등변삼각형의 두 밑각의 크기는 같다. (AB = AC이면 ∠B = ∠C)', '이등변삼각형의 꼭지각의 이등분선은 밑변을 수직이등분한다.', '두 내각의 크기가 같은 삼각형은 이등변삼각형이다. (∠B = ∠C이면 AB = AC)'],
      note: '"크기가 같은 두 각"은 꼭지각을 포함하지 않아요. 꼭지각은 두 밑각과 별개예요.' },
    checks: [

const skey = r => String(r.name || '').replace(/\s+/g, '').toLowerCase() + '|' + String(r.cls || '').replace(/\s+/g, '').replace(/[학년반]/g, '').replace(/[-–—.]/g, '-').toLowerCase();
function mergeLs(oldR, newR) {
  const out = {}, ids = new Set([...Object.keys(oldR.ls || {}), ...Object.keys(newR.ls || {})]), newer = newR.at >= oldR.at ? newR : oldR;
  ids.forEach(id => { const x = oldR.ls[id], y = newR.ls[id]; if (!x || !y) { out[id] = x || y; return; }
    if ((x.d || 0) !== (y.d || 0)) out[id] = x.d ? x : y; else if ((x.s || 0) !== (y.s || 0)) out[id] = (x.s || 0) > (y.s || 0) ? x : y; else out[id] = newer.ls[id]; });
  return out;
}
function addRep(rep) {
  rep.name = String(rep.name).replace(/\s+/g, ''); rep.cls = String(rep.cls || '').replace(/\s+/g, '');
  let k = skey(rep); const mv = TD.moves && TD.moves[k]; if (mv && TD.students[mv]) { k = mv; rep.cls = TD.students[mv].rep.cls; }
  const ex = TD.students[k];
  if (!ex) { TD.students[k] = { rep, fb: '' }; return 'add'; }
  const nl = mergeLs(ex.rep, rep), newer = rep.at >= ex.rep.at ? rep : ex.rep, merged = { ...newer, ls: nl, at: Math.max(ex.rep.at, rep.at) };
  if (JSON.stringify(nl) === JSON.stringify(ex.rep.ls) && merged.at === ex.rep.at) return null;
  if (JSON.stringify(nl) === JSON.stringify(ex.rep.ls)) { ex.rep.at = merged.at; return null; }
  ex.rep = merged; return 'upd';
}
function moveStudent(key, cls) {
  const x = TD.students[key]; cls = String(cls || '').replace(/\s+/g, ''); if (!x || !cls) return null;
  const rep = { ...x.rep, cls }, nk = skey(rep); if (nk === key) return key;
  delete TD.students[key]; (TD.moves = TD.moves || {})[key] = nk;
  const ex = TD.students[nk]; if (!ex) TD.students[nk] = { rep, fb: x.fb }; else { addRep(rep); if (x.fb && !ex.fb) ex.fb = x.fb; }
  tsave(); return nk;
}
